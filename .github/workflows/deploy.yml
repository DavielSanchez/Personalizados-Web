name: Deploy Frontend Development

on:
  push:
    branches:
      - dev  # Se activa solo en la rama de desarrollo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Clonar repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Crear .env (Ajusta las variables a lo que necesite tu proyecto)
      - name: Create .env
        run: |
          echo "VITE_API_LINK=https://api.edugestionrd.com" >> .env
          # Agrega aquí más variables si las necesitas

      # 3️⃣ Instalar dependencias y hacer build
      - name: Install and Build
        run: |
          npm install
          npm run build

      # 4️⃣ Subir a Hostinger vía FTP
      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Vite genera los archivos listos en 'dist'
          local-dir: ./dist/  
          # Ruta exacta para que caiga en el subdominio
          server-dir: domains/edugestionrd.com/public_html/development/
          # Importante para no romper nada más en el hosting
          dangerous-clean-slate: false
